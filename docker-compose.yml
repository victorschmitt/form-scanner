name: form-scanner

services:
  api:
    build:
      context: ./api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
    volumes:
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080/scan
    depends_on:
      - api
